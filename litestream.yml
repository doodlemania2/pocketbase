# Litestream configuration for continuous SQLite replication to Azure Blob Storage.
#
# Required environment variables:
#   LITESTREAM_REPLICA_URL       - Azure Blob Storage URL (e.g., abs://container-name/path)
#   LITESTREAM_ACCESS_KEY_ID     - Storage account name
#   LITESTREAM_SECRET_ACCESS_KEY - Storage account key
#
# When using Managed Identity, set:
#   AZURE_CLIENT_ID or leave unset for system-assigned identity

dbs:
  - path: /pb_data/data.db
    replicas:
      - type: abs
        url:  ${LITESTREAM_REPLICA_URL}/data.db
        sync-interval: 10s
        snapshot-interval: 1h
        retention: 168h  # 7 days

  - path: /pb_data/auxiliary.db
    replicas:
      - type: abs
        url:  ${LITESTREAM_REPLICA_URL}/auxiliary.db
        sync-interval: 10s
        snapshot-interval: 1h
        retention: 168h
