name: Deploy to Azure

on:
  push:
    branches: [deploy/azure]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_ENV_NAME: ${{ vars.AZURE_ENV_NAME }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}

    steps:
      - uses: actions/checkout@v6

      - name: Install azd
        uses: Azure/setup-azd@v2

      - name: Log in with Azure (Federated Credentials)
        run: |
          azd auth login \
            --client-id "$AZURE_CLIENT_ID" \
            --federated-credential-provider "github" \
            --tenant-id "$AZURE_TENANT_ID"
        shell: bash

      - name: Provision and Deploy
        run: azd up --no-prompt
        env:
          # Every secret below is written into the deployment's Key Vault by
          # infra/modules/keyvault.bicep and reaches the container app as a Key
          # Vault *reference*, never as a stored value — so `az containerapp
          # secret show` cannot return any of them. These repo secrets stay the
          # source of truth: a deploy rewrites the vault from them, so rotating
          # means changing the repo secret (or the vault, then the repo secret
          # before the next deploy overwrites it). See DEPLOY.md, "Where the
          # secrets live".
          AZD_INITIAL_ENVIRONMENT_CONFIG: ${{ secrets.AZD_INITIAL_ENVIRONMENT_CONFIG }}
          PB_ADMIN_EMAIL: ${{ secrets.PB_ADMIN_EMAIL }}
          PB_ADMIN_PASSWORD: ${{ secrets.PB_ADMIN_PASSWORD }}
          AZURE_RG_NAME: ${{ vars.AZURE_RG_NAME }}
          # Custom domain binding is staged across three deploys to handle the
          # asuid TXT validation chicken-and-egg: Phase 1 leaves CUSTOM_DOMAIN
          # unset so the env is created and customDomainVerificationId is
          # surfaced for the DNS update. Phase 2 sets CUSTOM_DOMAIN with
          # BIND_CERT=false so the hostname is added with bindingType=Disabled.
          # Phase 3 flips BIND_CERT=true to issue the managed cert and switch
          # the binding to SniEnabled. Defaults are intentionally empty — set
          # the repo variables explicitly per phase.
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          BIND_CERT: ${{ vars.BIND_CERT }}
          # WebAuthn relying-party config, decoupled from AppURL so passkeys are
          # scoped to the parent domain (stfoafrisco.org) while auth/email links
          # stay on the auth subdomain. Unset vars resolve to empty and the app
          # falls back to the AppURL hostname/origin.
          WEBAUTHN_RP_ID: ${{ vars.WEBAUTHN_RP_ID }}
          WEBAUTHN_RP_ORIGINS: ${{ vars.WEBAUTHN_RP_ORIGINS }}
          # OTLP export to the self-hosted SigNoz collector. Unset OTLP_ENDPOINT
          # disables telemetry export entirely — the app logs to SQLite only, as
          # upstream does. The auth header carries the ingest token, so it is a
          # repo SECRET, never a variable.
          OTLP_ENDPOINT: ${{ vars.OTLP_ENDPOINT }}
          OTLP_AUTH_HEADER: ${{ secrets.OTLP_AUTH_HEADER }}
          OTEL_SERVICE_NAME: ${{ vars.OTEL_SERVICE_NAME }}
          OTEL_ENVIRONMENT: ${{ vars.OTEL_ENVIRONMENT }}
          OTEL_MIN_LEVEL: ${{ vars.OTEL_MIN_LEVEL }}

      # Failure notice -> self-hosted ntfy (https://alert.thedoodleproject.net).
      # NTFY_URL is the FULL publish URL including the topic and ?auth=..., so it is a
      # repo SECRET (see the Alerting block in CLAUDE.md). A notice that cannot be
      # delivered must never turn into a second failure, hence the unconditional exit 0.
      - name: Notify ntfy on failure
        if: failure()
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$NTFY_URL" ]; then
            echo "::warning::NTFY_URL secret is not set; no failure notice was sent."
            exit 0
          fi
          curl -sS -m 15 --retry 2 -X POST "$NTFY_URL" \
            -H "Title: auth.stfoafrisco.org DEPLOY FAILED" \
            -H "Priority: high" \
            -H "Tags: rotating_light,azure" \
            -H "Click: $RUN_URL" \
            -d "${GITHUB_REPOSITORY} ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7} failed to deploy. See the run log: $RUN_URL" >/dev/null \
            || echo "::warning::ntfy notification could not be delivered."
          exit 0
