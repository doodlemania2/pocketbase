name: Check Upstream Releases

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 9am UTC
  workflow_dispatch:

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get latest upstream release
        id: upstream
        run: |
          LATEST=$(curl -sf https://api.github.com/repos/pocketbase/pocketbase/releases/latest | jq -r '.tag_name')
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"
          echo "Latest upstream PocketBase release: $LATEST"

      - name: Check if already synced
        id: check
        run: |
          # Check if the latest tag exists in our fork
          if git ls-remote --tags origin | grep -q "refs/tags/synced-${{ steps.upstream.outputs.version }}"; then
            echo "already_synced=true" >> "$GITHUB_OUTPUT"
            echo "Already synced to ${{ steps.upstream.outputs.version }}"
          else
            echo "already_synced=false" >> "$GITHUB_OUTPUT"
            echo "New upstream release available: ${{ steps.upstream.outputs.version }}"
          fi

      - name: Create issue for new release
        if: steps.check.outputs.already_synced == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.upstream.outputs.version }}';
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'upstream-sync',
              state: 'open',
            });
            const alreadyExists = existing.data.some(i => i.title.includes(version));
            if (!alreadyExists) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Upstream sync: PocketBase ${version} available`,
                body: `A new PocketBase release [${version}](https://github.com/pocketbase/pocketbase/releases/tag/${version}) is available.\n\n## Sync Steps\n\nSee [FORK_SYNC.md](./FORK_SYNC.md) for the full workflow.\n\n1. \`git fetch upstream\`\n2. Rebase \`feat/webauthn-passkey-support\` onto \`upstream/master\`\n3. \`make test\`\n4. Rebase \`deploy/azure\` onto updated webauthn branch\n5. \`make test && docker build\`\n6. Update FORK.md sync status`,
                labels: ['upstream-sync'],
              });
            }
