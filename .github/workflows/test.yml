name: Test

on:
  pull_request:
    branches: [deploy/azure, feat/webauthn-passkey-support]
  push:
    branches: [feat/webauthn-passkey-support]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./... -v --cover

      - name: Run linter
        uses: golangci/golangci-lint-action@v6
        with:
          args: -c ./golangci.yml

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t pocketbase-fork:test .

      - name: Smoke test container
        run: |
          docker run -d --name pb-test -p 8090:8090 pocketbase-fork:test
          sleep 5
          curl -sf http://localhost:8090/api/health || (docker logs pb-test && exit 1)
          docker stop pb-test
