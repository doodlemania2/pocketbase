name: Test

on:
  pull_request:
    branches: [master, deploy/azure, feat/webauthn-passkey-support]
  push:
    # NOTE: a workflow only runs if the file exists on the branch being pushed.
    # test.yml is part of the deploy layer, so it is present on master and
    # deploy/azure but NOT on feat/webauthn-passkey-support — the feat entry
    # below only takes effect once/if the file is carried there.
    branches: [master, deploy/azure, feat/webauthn-passkey-support]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./... -v --cover

      - name: Run linter
        # golangci.yml is schema `version: "2"`, which requires golangci-lint v2
        # (action v7+). The old action@v6 installs v1 and fails to parse it.
        # Upstream v0.40.0 renamed the `gomodguard` linter to `gomodguard_v2`,
        # which v2.6.2 rejects ("unknown linters: 'gomodguard_v2'") -- that name
        # needs golangci-lint >= v2.12.0.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: -c ./golangci.yml

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t pocketbase-fork:test .

      - name: Smoke test container
        run: |
          docker run -d --name pb-test -p 8090:8090 pocketbase-fork:test
          sleep 5
          curl -sf http://localhost:8090/api/health || (docker logs pb-test && exit 1)
          docker logs pb-test 2>&1 | grep -q "single-writer lock acquired" \
            || (echo "entrypoint did not take the single-writer lock"; docker logs pb-test; exit 1)
          docker stop pb-test

      # Regression test for #35: a rolling Container Apps revision transition
      # runs two replicas against the same /pb_data for ~40s, which corrupted
      # auxiliary.db four times. The second writer must refuse to start.
      - name: Single-writer lock keeps a second replica off the volume
        run: |
          docker volume create pb-lock-test
          docker run -d --name pb-lock-a -v pb-lock-test:/pb_data pocketbase-fork:test
          for _ in $(seq 30); do
            if docker logs pb-lock-a 2>&1 | grep -q "single-writer lock acquired"; then
              break
            fi
            sleep 1
          done
          docker logs pb-lock-a 2>&1 | grep -q "single-writer lock acquired" \
            || (echo "first replica never took the lock"; docker logs pb-lock-a; exit 1)

          set +e
          docker run --name pb-lock-b -v pb-lock-test:/pb_data \
            -e PB_SINGLE_WRITER_TIMEOUT=5 pocketbase-fork:test
          rc=$?
          set -e
          test "$rc" -ne 0 \
            || (echo "second replica started while the volume was locked"; docker logs pb-lock-b; exit 1)
          docker logs pb-lock-b 2>&1 | grep -q "still holds /pb_data" \
            || (echo "second replica failed for the wrong reason"; docker logs pb-lock-b; exit 1)

          docker rm -f pb-lock-a pb-lock-b
          docker volume rm pb-lock-test
